name: Publish to NuGet

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore BatchImageLoaderLibrary/BatchImageLoaderLibrary.csproj

      - name: Pack
        run: >
          dotnet pack BatchImageLoaderLibrary/BatchImageLoaderLibrary.csproj
          -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -o ${{ github.workspace }}/artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
