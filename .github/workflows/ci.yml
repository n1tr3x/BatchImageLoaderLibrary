name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build, test, pack (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Релиз = тег vX.Y.Z; номер должен совпадать с <Version> в csproj —
      # единственным источником версии.
      - name: Check tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $csproj = 'BatchImageLoaderLibrary/BatchImageLoaderLibrary.csproj'
          $version = (Select-Xml -Path $csproj -XPath '/Project/PropertyGroup/Version').Node.InnerText
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) {
            Write-Error "csproj Version=$version, but tag=$tag"
            exit 1
          }
          Write-Host "Version $version matches tag $tag"

      - name: Restore
        run: dotnet restore BatchImageLoaderLibrary.sln

      - name: Build
        run: dotnet build BatchImageLoaderLibrary.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test BatchImageLoaderLibrary.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Pack
        run: dotnet pack BatchImageLoaderLibrary/BatchImageLoaderLibrary.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

  publish:
    name: Publish to NuGet
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # Публикуется ровно тот пакет, что собран и протестирован выше.
      # .snupkg с символами уходит автоматически вместе с .nupkg.
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
